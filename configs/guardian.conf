# Productivity Guardian configuration
#
# This tracked configuration is intentionally non-destructive. Change MODE only
# after reviewing every PATH and PROCESS entry.

SCAN_INTERVAL=600
TERM_GRACE_PERIOD=10
MODE=dry-run

# A target must resolve inside one of these roots. In a local/systemd install,
# ~ is the user's home. In Docker, ~ is the /host-home bind mount.
ALLOWED_ROOT=~

PATH=~/.local/share/Steam/steamapps/common/dota 2 beta
PATH=~/.local/share/Steam/steamapps/appmanifest_570.acf

# Process names are matched exactly against /proc/<pid>/comm.
PROCESS=steam
